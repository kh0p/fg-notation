name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required to mint the signing certificate for build provenance.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Test
        run: node test/run.mjs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release may already exist if it was cut locally, so fall back
          # to refreshing its assets instead of failing the run.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css \
          || gh release upload "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css --clobber
